<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="627" viewBox="0 0 1200 627" role="img" aria-labelledby="title desc">
  <title id="title">Give Your AI a Watch</title>
  <desc id="desc">A dark technical illustration of a watch face whose message timestamps accumulate into AI context.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="1" stop-color="#172554"/>
    </linearGradient>
    <radialGradient id="dial" cx="42%" cy="35%" r="70%">
      <stop offset="0" stop-color="#1e3a5f"/>
      <stop offset="1" stop-color="#0b1324"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#818cf8"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#020617" flood-opacity=".55"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#38bdf8"/>
    </marker>
  </defs>

  <rect width="1200" height="627" fill="url(#bg)"/>
  <circle cx="1085" cy="70" r="205" fill="#38bdf8" opacity=".055"/>
  <circle cx="65" cy="615" r="230" fill="#818cf8" opacity=".06"/>

  <text x="68" y="72" fill="#94a3b8" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="21" font-weight="650" letter-spacing="3">AI WORKING PRACTICES</text>
  <text x="68" y="132" fill="#f8fafc" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="53" font-weight="780">Give Your AI a Watch</text>
  <text x="70" y="174" fill="#cbd5e1" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24">Persist time with the message. Preserve the prompt cache.</text>

  <g transform="translate(790 202)" filter="url(#shadow)">
    <rect x="105" y="-32" width="120" height="54" rx="18" fill="#1e293b" stroke="#475569" stroke-width="2"/>
    <rect x="105" y="278" width="120" height="54" rx="18" fill="#1e293b" stroke="#475569" stroke-width="2"/>
    <circle cx="165" cy="150" r="152" fill="url(#dial)" stroke="#64748b" stroke-width="5"/>
    <circle cx="165" cy="150" r="132" fill="none" stroke="#334155" stroke-width="2"/>
    <g stroke="#94a3b8" stroke-width="4" stroke-linecap="round">
      <line x1="165" y1="27" x2="165" y2="42"/>
      <line x1="288" y1="150" x2="273" y2="150"/>
      <line x1="165" y1="273" x2="165" y2="258"/>
      <line x1="42" y1="150" x2="57" y2="150"/>
    </g>
    <g stroke-linecap="round">
      <line x1="165" y1="150" x2="165" y2="72" stroke="#f8fafc" stroke-width="8"/>
      <line x1="165" y1="150" x2="225" y2="185" stroke="#38bdf8" stroke-width="6"/>
      <circle cx="165" cy="150" r="10" fill="#f8fafc"/>
    </g>
    <text x="165" y="224" text-anchor="middle" fill="#7dd3fc" font-family="ui-monospace, Consolas, monospace" font-size="18">&lt;time&gt;00:55+02:00&lt;/time&gt;</text>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Consolas, monospace" filter="url(#shadow)">
    <rect x="70" y="222" width="590" height="70" rx="14" fill="#111827" stroke="#334155" stroke-width="2"/>
    <text x="96" y="251" fill="#94a3b8" font-size="15">09 Sep · 22:02+02:00</text>
    <text x="96" y="278" fill="#f8fafc" font-size="20">user: “The build is still running.”</text>

    <rect x="70" y="317" width="590" height="70" rx="14" fill="#111827" stroke="#334155" stroke-width="2"/>
    <text x="96" y="346" fill="#94a3b8" font-size="15">10 Sep · 00:55+02:00</text>
    <text x="96" y="373" fill="#f8fafc" font-size="20">user: “Continue publishing.”</text>

    <path d="M680 304 H755" fill="none" stroke="#38bdf8" stroke-width="4" marker-end="url(#arrow)"/>
    <text x="707" y="286" text-anchor="middle" fill="#7dd3fc" font-size="15">context</text>
  </g>

  <line x1="70" y1="455" x2="1130" y2="455" stroke="#334155" stroke-width="2"/>
  <text x="600" y="515" text-anchor="middle" fill="#f8fafc" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="30" font-weight="680">A calendar tells an AI what year it is.</text>
  <text x="600" y="557" text-anchor="middle" fill="#7dd3fc" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="30" font-weight="680">A watch lets it participate in a process.</text>
  <rect x="70" y="592" width="1060" height="3" rx="2" fill="url(#accent)"/>
  <text x="70" y="619" fill="#94a3b8" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17">Sasha Shlemov · Zed PR #63987 · GitHub Copilot CLI · VS Code patch</text>
</svg>
