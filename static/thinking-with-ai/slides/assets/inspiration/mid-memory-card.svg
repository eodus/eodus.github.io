<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="627" viewBox="0 0 1200 627" role="img" aria-labelledby="title desc">
  <title id="title">AI Mid-Memory</title>
  <desc id="desc">A session becomes cumulative work through journal, memory, and stronger artifacts.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity=".28"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b8def"/>
    </marker>
  </defs>

  <rect width="1200" height="627" fill="url(#bg)"/>
  <circle cx="1085" cy="82" r="190" fill="#172554" opacity=".28"/>
  <circle cx="114" cy="586" r="160" fill="#7c2d12" opacity=".16"/>

  <text x="72" y="84" fill="#f8fafc" font-family="Inter, system-ui, sans-serif" font-size="46" font-weight="750" letter-spacing="1">AI MID-MEMORY</text>
  <text x="74" y="122" fill="#94a3b8" font-family="Inter, system-ui, sans-serif" font-size="20" letter-spacing="2.2">FROM A GOLDFISH TO A PERSONAL ASSISTANT</text>

  <g filter="url(#shadow)">
    <rect x="62" y="186" width="238" height="222" rx="18" fill="#121c2d" stroke="#334155" stroke-width="2"/>
    <rect x="348" y="186" width="238" height="222" rx="18" fill="#121c2d" stroke="#334155" stroke-width="2"/>
    <rect x="634" y="186" width="238" height="222" rx="18" fill="#121c2d" stroke="#334155" stroke-width="2"/>
    <rect x="920" y="186" width="218" height="222" rx="18" fill="#121c2d" stroke="#334155" stroke-width="2"/>
  </g>

  <g fill="none" stroke="#5b8def" stroke-width="4" marker-end="url(#arrow)">
    <path d="M 304 297 H 338"/>
    <path d="M 590 297 H 624"/>
    <path d="M 876 297 H 910"/>
  </g>

  <!-- Goldfish: deliberately simple line art, not a mascot. -->
  <g transform="translate(132 214)" fill="none" stroke="#f59e0b" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <ellipse cx="56" cy="53" rx="51" ry="34"/>
    <path d="M 104 53 L 149 22 L 142 53 L 149 84 Z"/>
    <path d="M 48 20 C 66 0 82 9 88 29"/>
    <circle cx="24" cy="46" r="3" fill="#f59e0b" stroke="none"/>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Consolas, monospace">
    <text x="181" y="330" text-anchor="middle" fill="#f8fafc" font-size="27" font-weight="700">SESSION</text>
    <text x="181" y="363" text-anchor="middle" fill="#94a3b8" font-size="16">current context</text>

    <text x="467" y="267" text-anchor="middle" fill="#f8fafc" font-size="27" font-weight="700">JOURNAL</text>
    <text x="467" y="306" text-anchor="middle" fill="#94a3b8" font-size="16">working trajectory</text>
    <text x="467" y="334" text-anchor="middle" fill="#94a3b8" font-size="16">attempts · failures</text>
    <text x="467" y="362" text-anchor="middle" fill="#94a3b8" font-size="16">next action</text>

    <text x="753" y="267" text-anchor="middle" fill="#f8fafc" font-size="27" font-weight="700">MEMORY</text>
    <text x="753" y="306" text-anchor="middle" fill="#94a3b8" font-size="16">reviewed precedent</text>
    <text x="753" y="334" text-anchor="middle" fill="#94a3b8" font-size="16">constraints · reasons</text>
    <text x="753" y="362" text-anchor="middle" fill="#94a3b8" font-size="16">working agreements</text>

    <text x="1029" y="249" text-anchor="middle" fill="#f8fafc" font-size="25" font-weight="700">ARTIFACTS</text>
    <text x="1029" y="290" text-anchor="middle" fill="#93c5fd" font-size="17">SCRIPT</text>
    <text x="1029" y="319" text-anchor="middle" fill="#93c5fd" font-size="17">TEST</text>
    <text x="1029" y="348" text-anchor="middle" fill="#93c5fd" font-size="17">SKILL</text>
    <text x="1029" y="377" text-anchor="middle" fill="#93c5fd" font-size="17">CONTRACT</text>
  </g>

  <line x1="72" y1="474" x2="1128" y2="474" stroke="#334155" stroke-width="2"/>
  <text x="600" y="534" text-anchor="middle" fill="#f8fafc" font-family="Inter, system-ui, sans-serif" font-size="29" font-weight="650">A goldfish with tools is still a goldfish.</text>
  <text x="600" y="574" text-anchor="middle" fill="#94a3b8" font-family="Inter, system-ui, sans-serif" font-size="18">The model forgets. The work does not have to.</text>
</svg>
