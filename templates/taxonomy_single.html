{% extends "base.html" %}
{% block title %}{{ term.name }} · {{ config.title }}{% endblock %}
{% block content %}
<h1>{{ term.name }}</h1>
<div class="post-list">
{% for page in term.pages %}
<article class="post-card">
  <time class="post-date" datetime="{{ page.date }}">{{ page.date }}</time>
  <h2><a href="{{ page.permalink }}">{{ page.title }}</a></h2>
  {% if page.description %}<p class="post-description">{{ page.description }}</p>{% endif %}
</article>
{% endfor %}
</div>
{% endblock %}
