{% extends "base.html" %}
{% block title %}{{ taxonomy.name | title }} · {{ config.title }}{% endblock %}
{% block content %}
<h1>{{ taxonomy.name | title }}</h1>
<div class="tag-cloud">
{% for term in terms %}
  <a class="tag" href="{{ term.permalink }}">{{ term.name }} <span class="tag-count">{{ term.pages | length }}</span></a>
{% endfor %}
</div>
{% endblock %}
